name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://prometheus.omnidynamics.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOSTNAME: prometheus.omnidynamics.dev
      ZONE: omnidynamics.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Worker + static assets + the three Durable Objects (SQLite, migration
      # tag v1). Needs only Account > Workers Scripts > Edit.
      - name: Deploy the Worker
        run: npx wrangler deploy

      # Secrets are pushed every deploy from the repo's Actions secrets, so the
      # Worker can never drift from them. SESSION_SIGNING_KEY is the exception:
      # it is generated once, here, the first time it is missing, and then left
      # alone — regenerating it would sign everybody out on every push.
      - name: Sync Worker secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENROLLMENT_TOKEN: ${{ secrets.ENROLLMENT_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(npx wrangler secret list --format json 2>/dev/null || echo '[]')
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const existing = JSON.parse(process.argv[1]).map((s) => s.name);
            const out = {};
            if (process.env.GEMINI_API_KEY) out.GEMINI_API_KEY = process.env.GEMINI_API_KEY;
            if (process.env.ENROLLMENT_TOKEN) out.ENROLLMENT_TOKEN = process.env.ENROLLMENT_TOKEN;
            if (!existing.includes("SESSION_SIGNING_KEY")) {
              out.SESSION_SIGNING_KEY = crypto.randomBytes(32).toString("base64url");
              console.log("Generating SESSION_SIGNING_KEY (first deploy).");
            }
            if (!out.ENROLLMENT_TOKEN) console.log("::warning::ENROLLMENT_TOKEN repo secret is not set; passkey enrollment will answer 503.");
            fs.writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Syncing:", Object.keys(out).join(", ") || "(nothing)");
          ' "$existing"
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      # The custom domain is attached through the Workers Domains API rather
      # than a `custom_domain` route in wrangler.toml, so a token without zone
      # permissions fails THIS step (with the exact permission named) instead
      # of failing the deploy above. Idempotent: PUT re-attaches the same
      # hostname to the same Worker.
      - name: Attach prometheus.omnidynamics.dev
        continue-on-error: true
        run: |
          set -uo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_id=$(curl -sS "${auth[@]}" "$api/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::warning::Could not read zone $ZONE. The API token needs Zone > Zone > Read and Zone > Workers Routes > Edit (plus DNS > Edit) on $ZONE — or bind $HOSTNAME once in the dashboard: Workers > prometheus > Settings > Domains & Routes > Add > Custom domain."
            exit 1
          fi
          body=$(jq -nc --arg h "$HOSTNAME" --arg z "$zone_id" '{hostname:$h, service:"prometheus", environment:"production", zone_id:$z}')
          result=$(curl -sS -X PUT "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -d "$body")
          if [ "$(echo "$result" | jq -r '.success')" = "true" ]; then
            echo "Custom domain attached: https://$HOSTNAME"
          else
            echo "::warning::Custom domain attach failed: $(echo "$result" | jq -c '.errors')"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -uo pipefail
          check() { for i in 1 2 3 4 5 6; do curl -sf "https://$1/api/health" && echo " <- $1" && return 0; sleep 10; done; return 1; }
          check prometheus.isahalim.workers.dev || { echo "::error::workers.dev host is not answering"; exit 1; }
          check "$HOSTNAME" || echo "::warning::$HOSTNAME is not answering yet (DNS/certificate can take a few minutes on first attach)."
